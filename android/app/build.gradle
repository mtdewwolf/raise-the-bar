plugins {
    id 'com.android.application'
}

// The game itself lives in ../index.html (the same file the browser version uses).
// It's copied into the APK's assets at build time so there is only one copy to maintain.
def gameAssetsDir = layout.buildDirectory.dir('generated/gameAssets')
// Leaderboard server: ./gradlew assembleRelease -PrtbApi=https://your-server (or RTB_API env var).
// Without it the app still plays fully offline, just with no online leaderboards.
def rtbApi = (project.findProperty('rtbApi') ?: System.getenv('RTB_API') ?: '').toString().trim()
def copyGame = tasks.register('copyGame', Copy) {
    from rootProject.file('../index.html')
    into gameAssetsDir
    inputs.property('rtbApi', rtbApi)
    if (rtbApi) {
        filter { String line -> line.replace('<meta name="rtb-api" content="">', '<meta name="rtb-api" content="' + rtbApi + '">') }
    }
}

// Upload key for Play App Signing. Release builds do not fall back to the public test key.
// RTB_KEYSTORE_FILE, RTB_KEYSTORE_PASSWORD, RTB_KEY_ALIAS, RTB_KEY_PASSWORD
def uploadKeystoreFile = (project.findProperty('RTB_KEYSTORE_FILE') ?: System.getenv('RTB_KEYSTORE_FILE') ?: '').toString().trim()
def uploadKeystorePassword = (project.findProperty('RTB_KEYSTORE_PASSWORD') ?: System.getenv('RTB_KEYSTORE_PASSWORD') ?: '').toString()
def uploadKeyAlias = (project.findProperty('RTB_KEY_ALIAS') ?: System.getenv('RTB_KEY_ALIAS') ?: '').toString().trim()
def uploadKeyPassword = (project.findProperty('RTB_KEY_PASSWORD') ?: System.getenv('RTB_KEY_PASSWORD') ?: '').toString()
def missingUploadKey = []
if (!uploadKeystoreFile) missingUploadKey << 'RTB_KEYSTORE_FILE'
if (!uploadKeystorePassword) missingUploadKey << 'RTB_KEYSTORE_PASSWORD'
if (!uploadKeyAlias) missingUploadKey << 'RTB_KEY_ALIAS'
if (!uploadKeyPassword) missingUploadKey << 'RTB_KEY_PASSWORD'
def uploadKeyConfigured = missingUploadKey.isEmpty()

android {
    namespace 'com.raisethebar.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.raisethebar.game'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.2.0'

        // Replay links use this URL. Friend invites are https://<host>/challenge/<code>
        // (see the manifest). With no RTB_API, links point at the GitHub Pages project site.
        def shareUri = new URI(rtbApi ?: 'https://mtdewwolf.github.io/raise-the-bar/')
        def shareHost = shareUri.host
        def sharePath = shareUri.path ?: '/'
        if (!shareHost || shareUri.scheme != 'https') throw new GradleException('RTB_API must use HTTPS for shared app links')
        buildConfigField 'String', 'SHARE_BASE_URL', "\"https://${shareHost}${sharePath}\""
        manifestPlaceholders = [shareHost: shareHost, sharePath: sharePath]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Public test key, committed on purpose so debug APKs update in place.
        // Release must not use it: the private key and passwords are in git history.
        test {
            storeFile file('test-signing.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (uploadKeyConfigured) {
            upload {
                storeFile file(uploadKeystoreFile)
                storePassword uploadKeystorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (uploadKeyConfigured) {
                signingConfig signingConfigs.upload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    sourceSets {
        main.assets.srcDir(gameAssetsDir)
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    // hinge / fold posture on foldables (Galaxy Z Fold Flex mode)
    implementation 'androidx.window:window-java:1.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

tasks.named('preBuild') { dependsOn copyGame }

def releaseTasksThatNeedUploadKey = [
        'assembleRelease',
        'bundleRelease',
        'packageRelease',
        'signReleaseBundle',
] as Set

gradle.taskGraph.whenReady { graph ->
    def requested = graph.allTasks.any { task ->
        task.project == project && releaseTasksThatNeedUploadKey.contains(task.name)
    }
    if (!requested) return
    if (!uploadKeyConfigured) {
        throw new GradleException(
                "Release builds need a Play upload keystore (see android/PLAY_APP_SIGNING.md).\n" +
                "Missing ${missingUploadKey.join(', ')}.\n" +
                "Set RTB_KEYSTORE_FILE, RTB_KEYSTORE_PASSWORD, RTB_KEY_ALIAS, and RTB_KEY_PASSWORD.\n" +
                "Debug APKs still use android/app/test-signing.keystore.\n" +
                "Skip assembleRelease / bundleRelease until the upload key exists.")
    }
    if (!file(uploadKeystoreFile).isFile()) {
        throw new GradleException("RTB_KEYSTORE_FILE is not a file: ${uploadKeystoreFile}")
    }
}
