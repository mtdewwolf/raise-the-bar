plugins {
    id 'com.android.application'
}

// The game itself lives in ../index.html (the same file the browser version uses).
// It's copied into the APK's assets at build time so there is only one copy to maintain.
def gameAssetsDir = layout.buildDirectory.dir('generated/gameAssets')
// Leaderboard server: ./gradlew assembleRelease -PrtbApi=https://your-server (or RTB_API env var).
// Without it the app still plays fully offline, just with no online leaderboards.
def rtbApi = (project.findProperty('rtbApi') ?: System.getenv('RTB_API') ?: '').toString().trim()
def copyGame = tasks.register('copyGame', Copy) {
    from rootProject.file('../index.html')
    into gameAssetsDir
    inputs.property('rtbApi', rtbApi)
    if (rtbApi) {
        filter { String line -> line.replace('<meta name="rtb-api" content="">', '<meta name="rtb-api" content="' + rtbApi + '">') }
    }
}

android {
    namespace 'com.raisethebar.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raisethebar.game'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.0'

        // Where shared challenge links point. Replay links only work for friends once the
        // web version is hosted here (e.g. GitHub Pages). The app also opens these links.
        def shareHost = 'mtdewwolf.github.io'
        def sharePath = '/raise-the-bar/'
        buildConfigField 'String', 'SHARE_BASE_URL', "\"https://${shareHost}${sharePath}\""
        manifestPlaceholders = [shareHost: shareHost, sharePath: sharePath]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // A fixed test key checked into the repo, so every build (local or CI) has the same
        // signature and a new APK installs as an UPDATE over the previous one. It is public:
        // fine for test builds, never for the Play Store.
        test {
            storeFile file('test-signing.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Your private release key, if provided (CI secrets or ~/.gradle/gradle.properties):
        // RTB_KEYSTORE_FILE, RTB_KEYSTORE_PASSWORD, RTB_KEY_ALIAS, RTB_KEY_PASSWORD
        def ksFile = project.findProperty('RTB_KEYSTORE_FILE') ?: System.getenv('RTB_KEYSTORE_FILE')
        if (ksFile) {
            upload {
                storeFile file(ksFile)
                storePassword (project.findProperty('RTB_KEYSTORE_PASSWORD') ?: System.getenv('RTB_KEYSTORE_PASSWORD'))
                keyAlias (project.findProperty('RTB_KEY_ALIAS') ?: System.getenv('RTB_KEY_ALIAS'))
                keyPassword (project.findProperty('RTB_KEY_PASSWORD') ?: System.getenv('RTB_KEY_PASSWORD'))
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Installable out of the box with the shared test key; uses your private key instead
            // when RTB_KEYSTORE_FILE is set (required before publishing to the Play Store).
            signingConfig signingConfigs.findByName('upload') ?: signingConfigs.test
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    sourceSets {
        main.assets.srcDir(gameAssetsDir)
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    // hinge / fold posture on foldables (Galaxy Z Fold Flex mode)
    implementation 'androidx.window:window-java:1.3.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

tasks.named('preBuild') { dependsOn copyGame }
