name: Android APK

on:
  push:
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lint
        env:
          # Physics preview APKs use the server running the same replay version.
          # Other branches use the repository's configured leaderboard server.
          RTB_API: ${{ (github.head_ref == 'feat/realistic-movement' || github.ref_name == 'feat/realistic-movement') && 'https://friend-challenges-test-production.up.railway.app' || vars.RTB_API }}
      - uses: actions/upload-artifact@v4
        with:
          name: raising-the-bar-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
