name: Android APK

on:
  push:
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      build_signed_play_release:
        description: Build the signed Play Store release AAB (requires configured secrets)
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDirectDebug assemblePlayStoreDebug assembleDirectInternalTest assemblePlayStoreInternalTest bundlePlayStoreInternalTest testDirectDebugUnitTest testPlayStoreDebugUnitTest lintDirectDebug lintPlayStoreDebug lintDirectInternalTest lintPlayStoreInternalTest
        env:
          # optional: set a repository variable RTB_API to your leaderboard server's URL
          RTB_API: ${{ vars.RTB_API }}
      - uses: actions/upload-artifact@v4
        with:
          name: raising-the-bar-apk
          path: |
            android/app/build/outputs/apk/direct/debug/app-direct-debug.apk
            android/app/build/outputs/apk/direct/internalTest/app-direct-internalTest.apk
            android/app/build/outputs/apk/playStore/debug/app-playStore-debug.apk
            android/app/build/outputs/apk/playStore/internalTest/app-playStore-internalTest.apk
            android/app/build/outputs/bundle/playStoreInternalTest/app-playStore-internalTest.aab

  signed-play-release:
    if: github.event_name == 'workflow_dispatch' && inputs.build_signed_play_release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      RTB_API: ${{ vars.RTB_API }}
      RTB_PLAY_SUPPORTER_PRODUCT: ${{ vars.RTB_PLAY_SUPPORTER_PRODUCT }}
      RTB_KEYSTORE_BASE64: ${{ secrets.RTB_KEYSTORE_BASE64 }}
      RTB_KEYSTORE_PASSWORD: ${{ secrets.RTB_KEYSTORE_PASSWORD }}
      RTB_KEY_ALIAS: ${{ secrets.RTB_KEY_ALIAS }}
      RTB_KEY_PASSWORD: ${{ secrets.RTB_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Materialize upload keystore
        shell: bash
        run: |
          : "${RTB_KEYSTORE_BASE64:?Missing RTB_KEYSTORE_BASE64 secret}"
          : "${RTB_KEYSTORE_PASSWORD:?Missing RTB_KEYSTORE_PASSWORD secret}"
          : "${RTB_KEY_ALIAS:?Missing RTB_KEY_ALIAS secret}"
          : "${RTB_KEY_PASSWORD:?Missing RTB_KEY_PASSWORD secret}"
          printf '%s' "$RTB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rtb-upload.jks"
          chmod 600 "$RUNNER_TEMP/rtb-upload.jks"
          echo "RTB_KEYSTORE_FILE=$RUNNER_TEMP/rtb-upload.jks" >> "$GITHUB_ENV"
      - name: Build signed Play Store AAB
        run: ./gradlew bundlePlayStoreRelease
      - uses: actions/upload-artifact@v4
        with:
          name: raising-the-bar-play-release
          path: android/app/build/outputs/bundle/playStoreRelease/app-playStore-release.aab
          if-no-files-found: error
      - name: Remove upload keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rtb-upload.jks"
