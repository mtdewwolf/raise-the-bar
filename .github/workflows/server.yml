name: Server tests

on:
  push:
    paths: ['index.html', 'server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['index.html', 'server/**', '.github/workflows/server.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun run test
        working-directory: server
